services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-coder-32b-instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-512}
      LLM_TOKEN_BUDGET: ${LLM_TOKEN_BUDGET:-50000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-200}
      SQL_MAX_RESULT_BYTES: ${SQL_MAX_RESULT_BYTES:-1000000}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-5000}
      SQL_MAX_TABLES: ${SQL_MAX_TABLES:-8}
      SQL_MAX_DEPTH: ${SQL_MAX_DEPTH:-3}
      DATABASE_URL: postgresql://bi_readonly:readonly_dev_pw@db:5432/analytics
      APP_DATABASE_URL: postgresql://app_rw:app_dev_pw@db:5432/appdb
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      DATABASE_URL_LIMITED: postgresql://bi_limited:limited_dev_pw@db:5432/analytics
      DATA_SOURCE: ${DATA_SOURCE:-sample}
      RETAIL_DATABASE_URL: postgresql://retail_analyst:retail_analyst_dev_pw@db:5432/retail
      RETAIL_DATABASE_URL_LIMITED: postgresql://retail_limited:retail_limited_dev_pw@db:5432/retail
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-admin_dev_pw}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: