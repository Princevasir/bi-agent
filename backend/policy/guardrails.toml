# Guardrail policy for the BI agent (GR-POL-01).
#
# The code enforces these rules; the model never reads this file. Changing it is a security change:
# update the tests first, run the backend suite and the real-model evaluation, and review the diff.
# The backend refuses to start if this file is malformed. Environment variables may lower a
# numeric limit below the value here, never raise it.

version = 1

[sql]
max_rows = 200              # rows returned per query; more are never read (GR-SQL-04)
max_result_bytes = 1000000  # JSON size of the rows returned per query (GR-SQL-04)
timeout_ms = 5000           # statement timeout per query
max_tables = 8              # table references per query, repeats counted (GR-SQL-02)
max_depth = 3               # how deeply SELECTs may be nested (GR-SQL-02)
repair_attempts = 1         # retries after a fixable SQL failure; 0 switches repair off (GR-WF-01)

[sql.functions]
# Only these functions may appear in generated SQL (GR-SQL-01). Typed functions are matched by
# sqlglot's class name; never add anything that runs SQL from a string, reads files or server
# settings, sleeps, or builds unbounded values (repeat, lpad, generate_series).
allowed_types = [
  # aggregates
  "Count", "Sum", "Avg", "Min", "Max", "Stddev", "StddevPop", "StddevSamp", "Variance", "VariancePop",
  "PercentileCont", "PercentileDisc", "ArrayAgg", "GroupConcat", "LogicalAnd", "LogicalOr",
  # window
  "RowNumber", "Rank", "DenseRank", "PercentRank", "CumeDist", "Ntile", "Lag", "Lead",
  "FirstValue", "LastValue", "NthValue",
  # conditional and casts
  "Case", "If", "Coalesce", "Nullif", "Greatest", "Least", "Cast", "TryCast",
  # maths
  "Abs", "Round", "Ceil", "Floor", "Sqrt", "Pow", "Ln", "Log", "Exp", "Sign",
  # dates and times
  "TimestampTrunc", "DateTrunc", "Extract", "TimeToStr", "ToChar", "StrToDate", "StrToTime",
  "CurrentDate", "CurrentTimestamp", "CurrentTime",
  # strings
  "Lower", "Upper", "Trim", "Length", "Concat", "ConcatWs", "Substring", "Replace", "Initcap",
  "Left", "Right", "StrPosition", "SplitPart",
]
# Functions sqlglot does not know, matched by their SQL name.
allowed_names = ["date_part", "make_date", "age", "to_date", "to_timestamp"]
# Second check behind the allowlist; no allowed name may start with one of these.
blocked_prefixes = ["pg_", "lo_", "dblink", "set_config", "current_setting"]
# The SQL names listed in the model's prompt (GR-POL-02). Every one must be accepted by the
# validator: tests/test_prompt_rules.py checks an example call for each.
prompt_functions = [
  "count", "sum", "avg", "min", "max", "stddev", "percentile_cont", "string_agg", "array_agg",
  "bool_and", "bool_or",
  "row_number", "rank", "dense_rank", "percent_rank", "cume_dist", "ntile", "lag", "lead",
  "first_value", "last_value", "nth_value",
  "coalesce", "nullif", "greatest", "least",
  "abs", "round", "ceil", "floor", "sqrt", "power", "ln", "log", "exp", "sign",
  "date_trunc", "extract", "date_part", "to_char", "to_date", "to_timestamp", "make_date", "age",
  "now", "current_date",
  "lower", "upper", "trim", "length", "concat", "concat_ws", "substring", "replace", "initcap",
  "left", "right", "strpos", "split_part",
]

# Data sources (M29b). DATA_SOURCE picks one (default: sample); an unknown name stops the backend.
# For each role: the tables it may query, the environment variable holding its read-only database
# login, and whether it may read columns the catalog flags as personal data. The database grants
# are the real enforcement; these must match them. "catalog = true" builds the prompt and the
# column rules from backend/catalog.
[sources.sample]
catalog = false

[sources.sample.roles.analyst]
tables = ["orders", "regions"]
database_url_env = "DATABASE_URL"

[sources.sample.roles.limited]
tables = ["regions"]
database_url_env = "DATABASE_URL_LIMITED"

[sources.retail]
catalog = true

[sources.retail.roles.analyst]
tables = [
  "regions", "countries", "stores", "warehouses",
  "categories", "brands", "suppliers", "products", "product_prices", "product_suppliers",
  "loyalty_tiers", "customers", "customer_addresses", "loyalty_memberships",
  "promotions", "orders", "order_items", "order_promotions", "payments", "shipments", "returns",
  "inventory_snapshots", "purchase_orders", "purchase_order_items",
  "campaigns", "web_sessions", "support_tickets", "departments", "employees",
]
database_url_env = "RETAIL_DATABASE_URL"
personal_data = false

[sources.retail.roles.limited]
tables = ["regions", "countries", "stores", "warehouses", "categories", "brands", "products", "product_prices"]
database_url_env = "RETAIL_DATABASE_URL_LIMITED"
personal_data = false
